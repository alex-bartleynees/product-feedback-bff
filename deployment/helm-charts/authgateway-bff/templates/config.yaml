apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authgateway-bff.fullname" . }}-config
  labels:
    {{- include "authgateway-bff.labels" . | nindent 4 }}
data:
  # OpenTelemetry settings
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.telemetry.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.telemetry.otlpProtocol | quote }}
  OTEL_SERVICE_VERSION: {{ .Values.image.tag | quote }}

  # ASP.NET Core settings
  ASPNETCORE_HTTP_PORTS: {{ .Values.config.aspNetCore.httpPorts | quote }}
  ASPNETCORE_URLS: {{ .Values.config.aspNetCore.urls | quote }}
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: {{ .Values.config.aspNetCore.forwardedHeadersEnabled | quote }}

  # .NET Runtime settings
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: {{ .Values.config.dotnet.globalizationInvariant | quote }}

  # Forwarded Headers configuration
  TrustedProxyNetwork: {{ .Values.config.forwardedHeaders.trustedProxyNetwork | default "10.244.0.0/16" | quote }}
  {{- range $index, $network := .Values.config.forwardedHeaders.knownNetworks }}
  ForwardedHeaders__KnownNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}

  # Keycloak settings
  KEYCLOAK_SERVER_URL: {{ .Values.keycloak.serverUrl | quote }}

  # OpenID Connect settings
  OpenIdConnectOptions__ClientId: {{ .Values.config.openIdConnect.clientId | quote }}
  OpenIdConnectOptions__RedirectUri: {{ .Values.config.openIdConnect.redirectUri | quote }}
  {{- if .Values.config.openIdConnect.oidcCookieSameSite }}
  OpenIdConnectOptions__OidcCookieSameSite: {{ .Values.config.openIdConnect.oidcCookieSameSite | quote }}
  {{- end }}
  {{- if .Values.config.openIdConnect.cookieExpireTimeSpanHours }}
  OpenIdConnectOptions__CookieExpireTimeSpanHours: {{ .Values.config.openIdConnect.cookieExpireTimeSpanHours | quote }}
  {{- end }}

  # Redis settings
  Redis__UseTls: {{ .Values.redis.useTls | quote }}
  Redis__Host: {{ .Values.redis.host | quote }}

  # Reverse Proxy settings - dynamically generate from values
  {{- range $routeName, $route := .Values.config.reverseProxy.routes }}
  ReverseProxy__Routes__{{ $routeName }}__ClusterId: {{ $route.clusterId | quote }}
  ReverseProxy__Routes__{{ $routeName }}__Match__Path: {{ $route.match.path | quote }}
  {{- if $route.order }}
  ReverseProxy__Routes__{{ $routeName }}__Order: {{ $route.order | quote }}
  {{- end }}
  {{- range $methodIndex, $method := $route.match.methods }}
  ReverseProxy__Routes__{{ $routeName }}__Match__Methods__{{ $methodIndex }}: {{ $method | quote }}
  {{- end }}
  {{- range $transformIndex, $transform := $route.transforms }}
  {{- range $transformKey, $transformValue := $transform }}
  ReverseProxy__Routes__{{ $routeName }}__Transforms__{{ $transformIndex }}__{{ $transformKey }}: {{ $transformValue | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $clusterName, $cluster := .Values.config.reverseProxy.clusters }}
  {{- range $destName, $dest := $cluster.destinations }}
  ReverseProxy__Clusters__{{ $clusterName }}__Destinations__{{ $destName }}__Address: {{ $dest.address | quote }}
  {{- end }}
  {{- end }}
